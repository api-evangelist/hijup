aid: hijup
name: HijUp
description: >-
  HijUp is an Indonesia-based modest-fashion e-commerce marketplace selling
  Muslim women's clothing online — abayas, blouses, dresses, tunics, printed
  scarves, hijabs, mukena, khimar, and related accessories — aggregating a
  large catalog of local Indonesian modest-wear brands (over a hundred labels
  listed under its brands directory) into a single storefront with
  international shipping. The company operates a consumer-facing shopping site
  (product catalog, categories, cart, checkout, and customer accounts) rather
  than a public developer platform; it publishes no API, SDK, or developer
  portal at this time. HijUp is backed by 500 Global and is tracked in the API
  Evangelist network as a company profile. Public contact is customer@hijup.com
  and +6221-78-24-001.
